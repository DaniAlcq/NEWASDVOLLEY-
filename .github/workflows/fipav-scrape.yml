name: Aggiorna dati FIPAV

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          FIPAV_STAGIONE_ID: ${{ vars.FIPAV_STAGIONE_ID || '' }}
          FIPAV_SOCIETA_ID:  ${{ vars.FIPAV_SOCIETA_ID  || '' }}
        run: python scraper/fipav_scraper.py

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
            exit 0
          fi
          git commit -m "Aggiorna dati FIPAV ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
